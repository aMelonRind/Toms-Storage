name: Build
on: [ pull_request, push, workflow_dispatch ]

jobs:
  build:
    strategy:
      matrix:
        java: [ 17 ]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v2

      - name: Stamp beta version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = "./Toms-Storage-120/gradle.properties";
            let file = fs.readFileSync(path).toString();
            const lines = file.split("\n").map(line => {
              if (line.trim().startsWith("mod_version=")) {
                return `${line}-beta-${process.env.GITHUB_SHA.substring(0, 7)}`;
              }
              return line;
            });
            fs.writeFileSync(path, lines.join("\n"));

      - name: setup JDK${{ matrix.java }}
        uses: actions/setup-java@v1
        with:
          java-version: ${{ matrix.java }}

      - name: Change wrapper permissions
        run: chmod +x ./Toms-Storage-120/gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Assemble Forge
        run: ./Toms-Storage-120/gradlew -p ./Toms-Storage-120 assemble

      - name: Compute artifact name
        id: artifact_name
        shell: bash
        run: |
          echo "value=$(./Toms-Storage-120/gradlew -p ./Toms-Storage-120 -q :printArtifactName | tail -n 1 | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4.4.0
        with:
          name: ${{ steps.artifact_name.outputs.value }}
          path: Toms-Storage-120/build/libs/