name: Build
on: [ pull_request, push ]

jobs:
  build:
    strategy:
      matrix:
        java: [ 17 ]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v2

      - name: Stamp beta version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = "./Toms-Storage-120/gradle.properties";
            let file = fs.readFileSync(path).toString();
            const lines = file.split("\n").map(line => {
              if (line.trim().startsWith("mod_version=")) {
                return `${line}-beta-${process.env.GITHUB_SHA.substring(0, 7)}`;
              }
              return line;
            });
            fs.writeFileSync(path, lines.join("\n"));

      - name: setup JDK${{ matrix.java }}
        uses: actions/setup-java@v1
        with:
          java-version: ${{ matrix.java }}

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/loom-cache
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Assemble Forge
        run: ./Toms-Storage-120/gradlew assemble

      - name: Compute artifact name
        id: artifact_name
        shell: bash
        run: |
          echo "value=$(./Toms-Storage-120/gradlew -q :printArtifactName)" >> "$GITHUB_OUTPUT"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4.4.0
        with:
          name: ${{ steps.artifact_name.outputs.value }}
          path: Toms-Storage-120/build/libs/